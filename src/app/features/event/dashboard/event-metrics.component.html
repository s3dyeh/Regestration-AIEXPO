<section class="metrics" aria-label="Live attendance totals">
  <article class="primary-metric">
    <span class="metric-label">CHECKED IN</span>
    <div class="total" data-testid="registration-total">
      <app-animated-count [value]="stats().total" />
    </div>
    <p>Attendees</p>
  </article>
  <article class="membership-metric">
    <span class="metric-label">IEEE MEMBERS</span>
    <div class="metric-number" data-testid="ieee-total">{{ memberRatio() }}<small>%</small></div>
    <p>{{ stats().ieeeMembers }} / {{ stats().total }} checked-in attendees</p>
    <svg
      class="membership-ring"
      viewBox="0 0 80 80"
      role="img"
      [attr.aria-label]="
        'IEEE members: ' +
        stats().ieeeMembers +
        ' of ' +
        stats().total +
        ' checked-in attendees, ' +
        memberRatio() +
        '%'
      "
    >
      <circle cx="40" cy="40" r="31" fill="none" stroke="#b89aff44" stroke-width="8" />
      <circle
        cx="40"
        cy="40"
        r="31"
        fill="none"
        stroke="#55c8f4"
        stroke-width="8"
        pathLength="100"
        [attr.stroke-dasharray]="memberRatio() + ' 100'"
        transform="rotate(-90 40 40)"
      />
    </svg>
  </article>
  <article>
    <span class="metric-label">UNIVERSITIES</span>
    <div class="metric-number" data-testid="university-total">
      {{ representedCount(groups('universities')) }}
    </div>
    <p>Represented by attendees</p>
  </article>
</section>
