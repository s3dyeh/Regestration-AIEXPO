<ol class="arrivals" aria-label="Latest three checked-in attendees">
  @for (arrival of latestArrivals(); track arrival.id; let rank = $index) {
    <li>
      <span class="avatar" aria-hidden="true">{{ rank + 1 }}</span>
      <span
        ><strong
          ><bdi>{{ arrival.displayName || 'Attendee' }}</bdi></strong
        ></span
      >
      <time [attr.datetime]="arrival.createdAt">{{
        arrival.createdAt | date: 'HH:mm:ss' : '+0300'
      }}</time>
    </li>
  } @empty {
    <li class="no-arrivals">No check-ins yet.</li>
  }
</ol>
