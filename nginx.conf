server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Narrow the wildcard to your project host if the deployment serves only one project.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  add_header Cache-Control "no-cache" always;
  location = /health/live { access_log off; return 200 'ok'; }
  location ~* \.(?:js|css|woff2|woff|ttf)$ { try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
